name: Bug 反馈
description: 反馈程序崩溃、教务解析异常、界面错乱或部署报错
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！**切勿在 Issue 中粘贴您的真实学号、密码、Cookie、Session Token 或 `config.json` 密钥信息。**
  - type: dropdown
    id: component
    attributes:
      label: 问题模块
      options:
        - C++20 后端服务 (backend)
        - Vue 3 前端界面 (frontend)
        - 强智教务 / 智慧门户适配
        - 学习通 / MOOC 异步扫描
        - Linux 部署 / Nginx / Systemd
        - 文档或其他
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 运行环境
      placeholder: "例如：Ubuntu 24.04 / Windows 11, GCC 13, Node 20, Chrome 130"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述与复现步骤
      placeholder: "1. 执行的操作...\n2. 预期行为...\n3. 实际结果..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的错误日志或截图
      placeholder: "请确保已隐藏真实学号、密码和 Token"
      render: text
