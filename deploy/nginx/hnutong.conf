# ============================================================================
# 海大通 (HnuTong) · Nginx 生产环境反向代理与 HTTPS 站点配置
# 部署位置（Ubuntu/Debian）：/etc/nginx/sites-available/hnutong.conf
# 启用软链：sudo ln -s /etc/nginx/sites-available/hnutong.conf /etc/nginx/sites-enabled/
# 请将 hnu.example.com 替换为您自己的备案/解析域名
# ============================================================================

upstream hnutong_cpp_backend {
    server 127.0.0.1:8788;
    keepalive 32;
}

# 1. HTTP (80) 接收 Let's Encrypt ACME 验证并强制跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hnu.example.com;

    # Certbot 自动续期验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS (443) 主服务：前端静态资源直出 + C++20 API 反向代理
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hnu.example.com;

    # SSL 证书路径（由 certbot --nginx -d hnu.example.com 自动签发或替换为自有证书）
    ssl_certificate     /etc/letsencrypt/live/hnu.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hnu.example.com/privkey.pem;

    # 现代 TLS 安全参数
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 请求体上限（与 C++ 后端一致限制为 2MB）
    client_max_body_size 2m;

    # Gzip 压缩加速移动端课表首屏加载
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/calendar application/json application/javascript image/svg+xml application/manifest+json;

    # 前端构建产物根目录
    root /opt/hnutong/frontend/dist;
    index index.html;

    # API 请求反向代理至本机 C++20 守护进程
    location /api/ {
        proxy_pass http://hnutong_cpp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超星/强智实时抓取偶有慢响应，预留 45 秒读取超时
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 45s;
    }

    # 带哈希指纹的静态构建资源开启 1 年强缓存
    # 注：Nginx 中 location 块内使用 add_header 会覆盖 server 级 add_header，因此需重复安全响应头
    location /assets/ {
        expires 365d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # PWA 清单与入口 HTML 禁止强缓存，保证发版后学生端秒级更新
    location = /manifest.webmanifest {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
    }
}
